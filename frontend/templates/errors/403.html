{% extends "base.html" if current_user else "auth_base.html" %}
{% block title %}403{% endblock %}
{% block content %}
<div class="card-x"><div class="card-body-x text-center py-5">
  <i class="bi bi-shield-lock display-3 text-primary"></i>
  <h1 class="h2 mt-3">403 &middot; Access denied</h1>
  <p class="text-muted mx-auto" style="max-width:520px">{{ message or "Please try again." }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user else url_for('auth.login') }}"><i class="bi bi-house me-1"></i>Back to {{ 'dashboard' if current_user else 'login' }}</a>
</div></div>
{% endblock %}
